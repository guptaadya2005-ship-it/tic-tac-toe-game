<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Industrial Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<!-- Animated Graphic Background Canvas -->
<canvas id="bg-canvas"></canvas>
<div class="grid-overlay"></div>

<!-- Game UI Console -->
<div class="console-container">
    
    <header class="console-header">
        <h1>Tic-Tac-Toe</h1>
    </header>

    <!-- Left Side Panel (Player X & Winner Stats) -->
    <aside class="side-panel">
        <div class="widget">
            <div class="widget-title">Player X (You)</div>
            <div class="widget-value" id="scoreX">0</div>
        </div>
        <div class="widget">
            <div class="widget-title">Last Winner</div>
            <div class="widget-value winner-text" id="lastWinner">-</div>
        </div>
        <div class="widget">
            <div class="widget-title">Draws</div>
            <div class="widget-value draw-text" id="drawsCount">0</div>
        </div>
    </aside>

    <!-- Center Board Area -->
    <main class="game-center">
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
            
            <svg class="strike-laser" id="laserCanvas">
                <line class="laser-line" id="laserLine" x1="0" y1="0" x2="0" y2="0"/>
            </svg>
        </div>
        
        <div class="status-bar" id="statusDisplay">Player X's Turn</div>
    </main>

    <!-- Right Side Panel (Player O & Loser Stats) -->
    <aside class="side-panel">
        <div class="widget">
            <div class="widget-title">Player O (CPU)</div>
            <div class="widget-value" id="scoreO">0</div>
        </div>
        <div class="widget">
            <div class="widget-title">Last Loser</div>
            <div class="widget-value loser-text" id="lastLoser">-</div>
        </div>
        <div class="widget">
            <div class="widget-title">Draws</div>
            <div class="widget-value draw-text" id="drawsCountRight">0</div>
        </div>
    </aside>

    <footer class="controls-row">
        <button class="btn" onclick="resetBoard()">New Game</button>
        <button class="btn" onclick="resetMatch()">Reset Match</button>
    </footer>
</div>


<script src="script.js"></script>

</body>
</html>
